name: Build Bomoko Lexika

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Les secrets ne sont pas utilisables dans « if: » : on passe par des variables d'environnement.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: python3 patch_platforms.py
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test

      # Signature de production (optionnelle). Sans secrets, l'APK est signé avec la clé de debug.
      - name: Préparer la signature
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      # Un APK par architecture (arm64 pour les téléphones récents, armeabi-v7a pour les anciens) :
      # ~3 fois plus léger qu'un APK « universel ». L'AAB sert au Play Store, qui livre le bon fichier à chaque appareil.
      - run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - run: flutter build appbundle --release

      - name: Vérifier la signature et la version Android minimale
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "=== $f ($(du -h "$f" | cut -f1))"
            "$BT/apksigner" verify --print-certs "$f" | grep -E "Signer #1 certificate (DN|SHA-256)"
            "$BT/aapt2" dump badging "$f" | grep -E "^package:|^sdkVersion|^targetSdkVersion" | cut -c1-120
          done

      - uses: actions/upload-artifact@v4
        with:
          name: bomoko-lexika-android
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    name: iOS (sans signature)
    runs-on: macos-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: python3 patch_platforms.py
      - run: flutter build ios --release --no-codesign

      - name: Créer l'IPA non signé
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          (cd build/ipa && zip -qry bomoko-lexika-unsigned.ipa Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: bomoko-lexika-ios-unsigned
          path: build/ipa/bomoko-lexika-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publier la release GitHub
    needs: [android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bomoko-lexika-android
          path: dist

      - name: Renommer les fichiers
        run: |
          for f in $(find dist -name 'app-*-release.apk'); do
            abi="$(basename "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            mv "$f" "dist/bomoko-lexika-${GITHUB_REF_NAME}-${abi}.apk"
          done
          mv "$(find dist -name app-release.aab)" "dist/bomoko-lexika-${GITHUB_REF_NAME}.aab"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bomoko-lexika-*.apk
            dist/bomoko-lexika-*.aab
          generate_release_notes: true
          
